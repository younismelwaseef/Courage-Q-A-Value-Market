<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Courageous vs. Non-Courageous Mobile</title>
    <!-- Load Tailwind CSS for layout and responsive utilities -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Fredoka & Inter fonts for playful, crisp readability -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom Typography & Theme Variables */
        :root {
            --bg-gradient: linear-gradient(160deg, #89CFF0 0%, #38BDF8 42%, #FDE047 78%, #FACC15 100%);
            --sign-accent: #FACC15;
            --sign-header-bg: #0F172A;
            --sign-header-text: #FDE047;
        }

        html, body {
            height: 100dvh;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            transition: background 0.55s ease;
            display: flex;
            justify-content: center;
        }

        .font-display {
            font-family: 'Fredoka', sans-serif;
        }

        /* Mobile App Shell (Centered 480px portrait frame on desktop, full screen on phone) */
        .mobile-shell {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            padding-left: max(14px, env(safe-area-inset-left));
            padding-right: max(14px, env(safe-area-inset-right));
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* 3D Tactile Mobile Arcade Buttons */
        .btn-courageous {
            background: linear-gradient(180deg, #3B82F6 0%, #1D4ED8 100%);
            box-shadow: 0 6px 0 #1E3A8A, 0 10px 18px rgba(30, 58, 138, 0.35);
            transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.1s ease, filter 0.12s ease;
        }
        .btn-courageous:active:not(:disabled) {
            transform: translateY(5px) scale(0.98);
            box-shadow: 0 1px 0 #1E3A8A, 0 3px 8px rgba(30, 58, 138, 0.25);
        }

        .btn-non-courageous {
            background: linear-gradient(180deg, #EF4444 0%, #B91C1C 100%);
            box-shadow: 0 6px 0 #7F1D1D, 0 10px 18px rgba(127, 29, 29, 0.35);
            transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.1s ease, filter 0.12s ease;
        }
        .btn-non-courageous:active:not(:disabled) {
            transform: translateY(5px) scale(0.98);
            box-shadow: 0 1px 0 #7F1D1D, 0 3px 8px rgba(127, 29, 29, 0.25);
        }

        .btn-courageous:disabled,
        .btn-non-courageous:disabled {
            opacity: 0.72;
            cursor: not-allowed;
        }

        /* Swipeable Scenario Signboard */
        .scenario-sign {
            background: #FFFFFF;
            border: 5px solid #0F172A;
            box-shadow: 0 9px 0 #0F172A, 0 16px 28px rgba(15, 23, 42, 0.24);
            touch-action: none;
            cursor: grab;
            will-change: transform;
        }
        .scenario-sign:active {
            cursor: grabbing;
        }

        .sign-tab {
            background-color: var(--sign-header-bg);
            color: var(--sign-header-text);
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .sign-post {
            width: 18px;
            height: 22px;
            background: linear-gradient(90deg, #78350F 0%, #B45309 50%, #78350F 100%);
            border-left: 3.5px solid #0F172A;
            border-right: 3.5px solid #0F172A;
            border-bottom: 3.5px solid #0F172A;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
        }

        /* Floating +1 / Oops Popups */
        @keyframes floatUpFade {
            0% { opacity: 0; transform: translate(-50%, 10px) scale(0.7); }
            25% { opacity: 1; transform: translate(-50%, -12px) scale(1.1); }
            80% { opacity: 1; transform: translate(-50%, -34px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -48px) scale(0.9); }
        }
        .floating-toast {
            position: absolute;
            left: 50%;
            top: -18px;
            pointer-events: none;
            z-index: 30;
            animation: floatUpFade 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Card Enter & Feedback Animations */
        @keyframes popIn {
            0% { transform: scale(0.9) translateY(10px); opacity: 0.3; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes shakeWrong {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-9px) rotate(-1.5deg); }
            40% { transform: translateX(9px) rotate(1.5deg); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shakeWrong 0.4s ease-in-out;
        }

        @keyframes pulseCorrect {
            0% { transform: scale(1); }
            45% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .animate-correct {
            animation: pulseCorrect 0.35s ease-out;
        }

        /* Subtle Idle Float for Trophy */
        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }
        .trophy-bob {
            display: inline-block;
            animation: gentleBounce 2.2s ease-in-out infinite;
        }

        /* Confetti Canvas Overlay */
        #confetti-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 60;
        }
    </style>
</head>
<body>

    <!-- Confetti overlay for 12/12 wins -->
    <canvas id="confetti-canvas"></canvas>

    <!-- MOBILE PORTRAIT GAME SHELL -->
    <div class="mobile-shell">

        <!-- TOP HUD BAR -->
        <header class="w-full grid grid-cols-3 items-center gap-1.5 z-10 shrink-0">
            
            <!-- Top Left: Vibrant Theme Switcher & Audio Toggle -->
            <div class="flex items-center justify-start gap-1.5">

                    class="flex items-center gap-1 bg-white/95 active:bg-white text-slate-900 font-bold text-xs px-2.5 py-2 rounded-2xl border-[3px] border-slate-900 shadow-[0_3px_0_#0f172a] active:translate-y-0.5 active:shadow-none transition-all cursor-pointer">
                    <span class="text-sm">🎨</span>
                    <span id="theme-short" class="font-display tracking-tight">Sky/Sun</span>
                </button>

                <button id="sound-btn" onclick="toggleSound()" title="Mute/Unmute Sound"
                    class="bg-white/95 active:bg-white text-slate-900 font-bold text-sm p-2 rounded-2xl border-[3px] border-slate-900 shadow-[0_3px_0_#0f172a] active:translate-y-0.5 active:shadow-none transition-all cursor-pointer"

            </div>

                    <div class="text-[9px] font-extrabold uppercase tracking-wider text-slate-500 leading-none mb-0.5">
                        Score
                    </div>
                    <div id="score-display" class="font-display text-2xl font-bold text-slate-900 leading-none">
                        0/12
                    </div>
                </div>
            </div>

            <!-- Top Right: Wins Counter with Trophy Emoji -->
            <div class="flex items-center justify-end">
                <div class="bg-amber-300 px-3 py-2 rounded-2xl border-[3.5px] border-slate-900 shadow-[0_4px_0_#0f172a] flex items-center">
                    <span id="wins-display" class="font-display text-base sm:text-lg font-bold text-slate-900 tracking-tight whitespace-nowrap">
                        wins<span class="trophy-bob">🏆</span>: 0
                    </span>
                </div>
            </div>

        </header>

        <!-- SUB-HEADER: Round Progress Bar & Theme Badge -->
        <div class="w-full flex flex-col items-center gap-1.5 my-1 shrink-0 z-10">
            <div class="flex items-center justify-between w-full px-1">
                <span id="question-counter" class="bg-slate-900/85 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full">
                    Prompt 1 / 12
                </span>
                <span id="theme-name-pill" class="bg-white/75 text-slate-900 text-[11px] font-bold px-2.5 py-0.5 rounded-full">
                    Baby Blue & Bright Yellow
                </span>
            </div>
            <!-- 12-Segment Progress Bar -->
            <div id="progress-dots" class="w-full grid grid-cols-12 gap-1 px-0.5" aria-label="Round Progress">
                <!-- Populated dynamically by JS -->
            </div>
        </div>

        <!-- CENTER PLAY AREA: TWO BUTTONS + SIGN DIRECTLY BENEATH -->
        <main class="w-full flex-1 flex flex-col justify-center items-center min-h-0 py-1 z-10">

            <!-- TWO CHUNKY TOUCH BUTTONS (Blue Courageous & Red Non-Courageous) -->
            <div class="w-full grid grid-cols-2 gap-3 mb-4 shrink-0">
                <!-- Blue Courageous Button -->
                <button id="btn-courageous" onclick="handleChoice(true)"
                    class="btn-courageous w-full py-4 px-2 rounded-3xl border-[4px] border-slate-900 text-white font-display flex flex-col items-center justify-center gap-0.5 cursor-pointer">
                    <span class="text-3xl leading-none">🦁</span>
                    <span class="text-lg sm:text-xl font-bold tracking-wide leading-tight">Courageous</span>
                </button>

                <!-- Red Non-Courageous Button -->
                <button id="btn-non-courageous" onclick="handleChoice(false)"
                    class="btn-non-courageous w-full py-4 px-2 rounded-3xl border-[4px] border-slate-900 text-white font-display flex flex-col items-center justify-center gap-0.5 cursor-pointer">
                    <span class="text-3xl leading-none">🙈</span>
                    <span class="text-lg sm:text-xl font-bold tracking-wide leading-tight">Non-Courageous</span>
                </button>
            </div>

            <!-- THE SIGN BENEATH THE BUTTONS (Supports Tap + Left/Right Swipe) -->
            <div class="w-full flex-1 max-h-[300px] flex flex-col items-center justify-center relative">
                
                <!-- Sign Header Tab -->
                <div class="sign-tab font-display text-xs font-bold uppercase tracking-widest px-4 py-1 rounded-t-2xl border-t-[4px] border-x-[4px] border-slate-900 -mb-1 z-10 flex items-center gap-1.5 shrink-0">
                    <span>📌</span>
                    <span>Scenario Sign</span>
                    <span>📌</span>
                </div>

                <!-- Main Swipeable Sign Card -->
                <div id="scenario-sign" class="scenario-sign w-full flex-1 rounded-3xl p-5 flex flex-col items-center justify-center text-center relative">
                    
                    <!-- Decorative Corner Rivets -->
                    <span class="w-2.5 h-2.5 rounded-full bg-slate-300 border-2 border-slate-900 absolute top-3 left-3"></span>
                    <span class="w-2.5 h-2.5 rounded-full bg-slate-300 border-2 border-slate-900 absolute top-3 right-3"></span>
                    <span class="w-2.5 h-2.5 rounded-full bg-slate-300 border-2 border-slate-900 absolute bottom-3 left-3"></span>
                    <span class="w-2.5 h-2.5 rounded-full bg-slate-300 border-2 border-slate-900 absolute bottom-3 right-3"></span>

                    <!-- Live Swipe Direction Overlay Badge -->
                    <div id="swipe-hint-overlay" class="hidden absolute top-3 px-3 py-0.5 rounded-full font-display font-bold text-xs border-2 border-slate-900 shadow-sm">
                    </div>

                    <!-- Answer Feedback Pill -->
                    <div id="feedback-badge" class="hidden mb-2.5 px-3.5 py-1 rounded-full font-display font-bold text-xs sm:text-sm border-2 border-slate-900">
                    </div>

                    <!-- Scenario Text -->
                    <p id="scenario-text" class="font-display text-xl sm:text-2xl font-semibold text-slate-900 leading-snug px-1">
                        Loading scenario...
                    </p>
                </div>

                <!-- Wooden Sign Posts Underneath -->
                <div class="flex justify-center gap-24 -mt-0.5 shrink-0">
                    <div class="sign-post"></div>
                    <div class="sign-post"></div>
                </div>
            </div>

        </main>

        <!-- BOTTOM TOUCH HINT FOOTER -->
        <footer class="w-full text-center shrink-0 pt-1 z-10">
            <div class="inline-flex items-center gap-2 bg-white/75 backdrop-blur-xs text-slate-900 text-[11px] font-bold px-3.5 py-1 rounded-full border border-slate-900/15">
                <span>👈 Swipe Sign Left = Non-Courageous</span>
                <span>•</span>
                <span>Right = Courageous 👉</span>
            </div>
        </footer>

    </div>

    <!-- END-OF-ROUND MODAL -->
    <div id="round-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <div id="modal-card" class="bg-white w-full max-w-[400px] rounded-3xl border-[4px] border-slate-900 shadow-[0_10px_0_#0f172a] p-6 text-center animate-pop">
            <div id="modal-emoji" class="text-6xl mb-2">🏆</div>
            <h2 id="modal-title" class="font-display text-3xl font-bold text-slate-900 mb-1.5">
                Perfect Round!
            </h2>
            <div id="modal-score-pill" class="inline-block bg-amber-300 border-[3px] border-slate-900 font-display text-2xl font-bold px-5 py-1 rounded-2xl mb-3">
                12/12
            </div>
            <p id="modal-message" class="text-slate-700 font-medium text-sm sm:text-base mb-5 leading-relaxed">
                Amazing job! You got all 12/12 right and earned a trophy!
            </p>
            <button onclick="startNewRound()"
                class="w-full py-3.5 px-6 rounded-2xl bg-emerald-500 active:bg-emerald-400 text-white font-display text-xl sm:text-2xl font-bold border-[4px] border-slate-900 shadow-[0_5px_0_#065f46] active:translate-y-1 active:shadow-none transition-all cursor-pointer">
                Play Next Round 🚀
            </button>
        </div>
    </div>

        ];

        // =========================================================================
        // 2. VIBRANT MOBILE COLOR THEMES
        // =========================================================================
        const THEMES = [
            {
                name: "Baby Blue & Bright Yellow",
                short: "Sky/Sun",
                gradient: "linear-gradient(160deg, #89CFF0 0%, #38BDF8 42%, #FDE047 78%, #FACC15 100%)",
                tabBg: "#0F172A",
                tabText: "#FDE047"
            },
            {
                name: "Purple & Burgundy",
                short: "Royal",
                gradient: "linear-gradient(160deg, #A855F7 0%, #7E22CE 44%, #9F1239 80%, #881337 100%)",
                tabBg: "#4C0519",
                tabText: "#F5D0FE"
            },
            {
                name: "Coral & Electric Mint",
                short: "Tropical",
                gradient: "linear-gradient(160deg, #6EE7B7 0%, #34D399 42%, #FDA4AF 78%, #FB7185 100%)",
                tabBg: "#064E3B",
                tabText: "#FECDD3"
            },
            {
                name: "Tangerine & Ocean Teal",
                short: "Sunset",
                gradient: "linear-gradient(160deg, #2DD4BF 0%, #0D9488 42%, #FDBA74 78%, #F97316 100%)",
                tabBg: "#134E4A",
                tabText: "#FED7AA"
            }
        ];

        // =========================================================================
        // 3. GAME STATE, HAPTICS & WEB AUDIO SYNTHESIS
        // =========================================================================
        const ROUND_LENGTH = 12;
        const WINS_STORAGE_KEY = "courageous_mobile_wins_v1";

        let currentThemeIndex = 0;
        let soundEnabled = true;

        let deck = [];              // Shuffled pool of all 96 scenarios
        let roundPrompts = [];      // 12 unique scenarios per round
        let currentQuestionIdx = 0; // 0 to 11
        let roundScore = 0;         // 0 to 12
        let roundResults = [];      // Boolean array for progress bar
        let totalWins = parseInt(localStorage.getItem(WINS_STORAGE_KEY) || "0", 10) || 0;
        let isTransitioning = false;

        // Safe mobile haptic vibration helper
        function triggerHaptic(pattern) {
            try {
                if (navigator && typeof navigator.vibrate === "function") {
                    navigator.vibrate(pattern);
                }
            } catch (e) {
                // Ignore if unsupported
            }
        }

        // Web Audio API synthesizer for responsive mobile game audio
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        const audioCtx = AudioContextClass ? new AudioContextClass() : null;

        function playTone(type) {
            if (!soundEnabled || !audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'tap') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(420, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.05);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                    osc.start(now);
                    osc.stop(now + 0.06);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);       // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.07); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.14); // G5
                    gain.gain.setValueAtTime(0.18, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
                    osc.start(now);
                    osc.stop(now + 0.36);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(185, now);
                    osc.frequency.linearRampToValueAtTime(135, now + 0.25);
                    gain.gain.setValueAtTime(0.13, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
                    osc.start(now);
                    osc.stop(now + 0.28);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'triangle';
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, now + i * 0.09);
                        g.gain.setValueAtTime(0.2, now + i * 0.09);
                        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.45);
                        o.start(now + i * 0.09);
                        o.stop(now + i * 0.09 + 0.45);
                    });
                }
            } catch (e) {
                // Ignore blocked audio
            }
        }

        // Fisher-Yates Shuffle
        function shuffleArray(array) {
            const copy = [...array];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function drawTwelvePrompts() {
            if (deck.length < ROUND_LENGTH) {
                deck = shuffleArray(ALL_SCENARIOS);
            }
            return deck.splice(0, ROUND_LENGTH);
        }

        // =========================================================================
        // 4. CORE GAMEPLAY FUNCTIONS
        // =========================================================================
        function startNewRound() {
            playTone('tap');
            triggerHaptic(15);

            const modal = document.getElementById('round-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');

            roundPrompts = drawTwelvePrompts();
            currentQuestionIdx = 0;
            roundScore = 0;
            roundResults = [];
            isTransitioning = false;

            updateHUD();
            renderProgressDots();
            showCurrentPrompt();
        }

        function showCurrentPrompt() {
            const prompt = roundPrompts[currentQuestionIdx];
            const signEl = document.getElementById('scenario-sign');
            const textEl = document.getElementById('scenario-text');
            const badgeEl = document.getElementById('feedback-badge');
            const swipeOverlay = document.getElementById('swipe-hint-overlay');
            const btnBlue = document.getElementById('btn-courageous');
            const btnRed = document.getElementById('btn-non-courageous');

            // Reset sign transform and styling
            signEl.style.transition = '';
            signEl.style.transform = '';
            signEl.style.backgroundColor = '#FFFFFF';
            signEl.style.borderColor = '#0F172A';
            signEl.classList.remove('animate-shake', 'animate-correct', 'animate-pop');
            void signEl.offsetWidth;
            signEl.classList.add('animate-pop');

            badgeEl.classList.add('hidden');
            swipeOverlay.classList.add('hidden');
            textEl.textContent = `"${prompt.text}"`;

            btnBlue.disabled = false;
            btnRed.disabled = false;
            isTransitioning = false;
        }

        function spawnFloatingFeedback(isCorrect) {
            const signEl = document.getElementById('scenario-sign');
            const toast = document.createElement('div');
            toast.className = `floating-toast font-display font-bold text-lg px-3.5 py-0.5 rounded-full border-[3px] border-slate-900 shadow-md ${
                isCorrect ? 'bg-emerald-400 text-slate-950' : 'bg-rose-500 text-white'
            }`;
            toast.textContent = isCorrect ? '+1 ⭐' : 'Oops! ❌';
            signEl.appendChild(toast);
            setTimeout(() => toast.remove(), 850);
        }

        function handleChoice(userChoseCourageous) {
            if (isTransitioning) return;
            isTransitioning = true;

            const btnBlue = document.getElementById('btn-courageous');
            const btnRed = document.getElementById('btn-non-courageous');
            btnBlue.disabled = true;
            btnRed.disabled = true;

            const currentPrompt = roundPrompts[currentQuestionIdx];
            const isCorrect = (userChoseCourageous === currentPrompt.isCourageous);

            const signEl = document.getElementById('scenario-sign');
            const badgeEl = document.getElementById('feedback-badge');
            const swipeOverlay = document.getElementById('swipe-hint-overlay');

            // Reset any drag offset cleanly
            signEl.style.transition = 'background-color 0.2s ease, border-color 0.2s ease';
            signEl.style.transform = '';
            swipeOverlay.classList.add('hidden');
            badgeEl.classList.remove('hidden');

            spawnFloatingFeedback(isCorrect);

            if (isCorrect) {
                roundScore++;
                roundResults.push(true);
                playTone('correct');
                triggerHaptic([20, 30, 25]);

                signEl.style.backgroundColor = '#DCFCE7';
                signEl.style.borderColor = '#16A34A';
                signEl.classList.add('animate-correct');

                badgeEl.className = 'mb-2 px-3 py-0.5 rounded-full font-display font-bold text-xs sm:text-sm border-2 border-slate-900 bg-emerald-400 text-slate-950';
                badgeEl.textContent = currentPrompt.isCourageous
                    ? '✅ Courageous!'
                    : '✅ Non-Courageous!';
            } else {
                roundResults.push(false);
                playTone('wrong');
                triggerHaptic([60, 40, 60]);

                signEl.style.backgroundColor = '#FEE2E2';
                signEl.style.borderColor = '#DC2626';
                signEl.classList.add('animate-shake');

                badgeEl.className = 'mb-2 px-3 py-0.5 rounded-full font-display font-bold text-xs sm:text-sm border-2 border-slate-900 bg-rose-400 text-slate-950';
                badgeEl.textContent = currentPrompt.isCourageous
                    ? '❌ Actually Courageous!'
                    : '❌ Actually Non-Courageous!';
            }

            updateHUD();
            renderProgressDots();

            setTimeout(() => {
                currentQuestionIdx++;
                if (currentQuestionIdx < ROUND_LENGTH) {
                    updateHUD();
                    showCurrentPrompt();
                } else {
                    finishRound();
                }
            }, 950);
        }

        function finishRound() {
            const modal = document.getElementById('round-modal');
            const emojiEl = document.getElementById('modal-emoji');
            const titleEl = document.getElementById('modal-title');
            const scorePillEl = document.getElementById('modal-score-pill');
            const msgEl = document.getElementById('modal-message');

            scorePillEl.textContent = `${roundScore}/${ROUND_LENGTH}`;

            if (roundScore === ROUND_LENGTH) {
                totalWins++;
                try {
                    localStorage.setItem(WINS_STORAGE_KEY, String(totalWins));
                } catch (e) {}

                updateHUD();
                playTone('win');
                triggerHaptic([40, 50, 40, 50, 90]);
                launchConfetti();

                emojiEl.textContent = '🏆';
                titleEl.textContent = '12/12 Perfect Win!';
                scorePillEl.className = 'inline-block bg-amber-300 border-[3px] border-slate-900 font-display text-2xl font-bold px-5 py-1 rounded-2xl mb-3';
                msgEl.textContent = `You nailed all 12/12! Your wins🏆 counter just went up to ${totalWins}!`;
            } else {
                emojiEl.textContent = '💪';
                titleEl.textContent = 'Round Over!';
                scorePillEl.className = 'inline-block bg-sky-200 border-[3px] border-slate-900 font-display text-2xl font-bold px-5 py-1 rounded-2xl mb-3';
                msgEl.textContent = `You scored ${roundScore}/12! Get a 12/12 streak next round to earn a trophy 🏆!`;
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function updateHUD() {
            document.getElementById('score-display').textContent = `${roundScore}/${ROUND_LENGTH}`;

            const displayPromptNum = Math.min(currentQuestionIdx + 1, ROUND_LENGTH);
            document.getElementById('question-counter').textContent = `Prompt ${displayPromptNum} / ${ROUND_LENGTH}`;

            document.getElementById('wins-display').innerHTML = `wins<span class="trophy-bob">🏆</span>: ${totalWins}`;
        }

        function renderProgressDots() {
            const container = document.getElementById('progress-dots');
            container.innerHTML = '';

            for (let i = 0; i < ROUND_LENGTH; i++) {
                const seg = document.createElement('div');
                let colorClass = 'bg-white/60 border-slate-900/40';

                if (i < roundResults.length) {
                    colorClass = roundResults[i]
                        ? 'bg-emerald-400 border-slate-900'
                        : 'bg-rose-500 border-slate-900';
                } else if (i === currentQuestionIdx) {
                    colorClass = 'bg-amber-300 border-slate-900 scale-y-125';
                }

                seg.className = `h-2.5 rounded-full border-[1.5px] transition-all duration-200 ${colorClass}`;
                container.appendChild(seg);
            }
        }

        // =========================================================================
        // 5. MOBILE SWIPE GESTURES ON SCENARIO SIGN
        // =========================================================================
        function setupSwipeGestures() {
            const signEl = document.getElementById('scenario-sign');
            const swipeOverlay = document.getElementById('swipe-hint-overlay');
            let startX = 0;
            let currentDeltaX = 0;
            let isDragging = false;
            const SWIPE_THRESHOLD = 68;

            signEl.addEventListener('pointerdown', (e) => {
                if (isTransitioning) return;
                isDragging = true;
                startX = e.clientX;
                currentDeltaX = 0;
                signEl.style.transition = 'none';
                signEl.setPointerCapture(e.pointerId);
            });

            signEl.addEventListener('pointermove', (e) => {
                if (!isDragging || isTransitioning) return;
                currentDeltaX = e.clientX - startX;
                const rotateDeg = Math.max(-12, Math.min(12, currentDeltaX * 0.08));
                signEl.style.transform = `translateX(${currentDeltaX * 0.65}px) rotate(${rotateDeg}deg)`;

                if (currentDeltaX > 24) {
                    swipeOverlay.classList.remove('hidden');
                    swipeOverlay.className = 'absolute top-3 px-3 py-0.5 rounded-full font-display font-bold text-xs border-2 border-slate-900 bg-blue-500 text-white';
                    swipeOverlay.textContent = '🦁 Courageous →';
                    signEl.style.borderColor = '#2563EB';
                } else if (currentDeltaX < -24) {
                    swipeOverlay.classList.remove('hidden');
                    swipeOverlay.className = 'absolute top-3 px-3 py-0.5 rounded-full font-display font-bold text-xs border-2 border-slate-900 bg-red-500 text-white';
                    swipeOverlay.textContent = '← Non-Courageous 🙈';
                    signEl.style.borderColor = '#DC2626';
                } else {
                    swipeOverlay.classList.add('hidden');
                    signEl.style.borderColor = '#0F172A';
                }
            });

            function endDrag(e) {
                if (!isDragging) return;
                isDragging = false;
                try { signEl.releasePointerCapture(e.pointerId); } catch (_) {}

                if (isTransitioning) return;

                if (currentDeltaX >= SWIPE_THRESHOLD) {
                    handleChoice(true); // Swiped Right -> Courageous
                } else if (currentDeltaX <= -SWIPE_THRESHOLD) {
                    handleChoice(false); // Swiped Left -> Non-Courageous
                } else {
                    // Snap back cleanly
                    signEl.style.transition = 'transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s ease';
                    signEl.style.transform = '';
                    signEl.style.borderColor = '#0F172A';
                    swipeOverlay.classList.add('hidden');
                }
            }

            signEl.addEventListener('pointerup', endDrag);
            signEl.addEventListener('pointercancel', endDrag);
        }

        // =========================================================================
        // 6. THEME SWITCHER & SOUND TOGGLE
        // =========================================================================
        function cycleTheme() {
            playTone('tap');
            triggerHaptic(12);
            currentThemeIndex = (currentThemeIndex + 1) % THEMES.length;
            const theme = THEMES[currentThemeIndex];
            document.documentElement.style.setProperty('--bg-gradient', theme.gradient);
            document.documentElement.style.setProperty('--sign-header-bg', theme.tabBg);
            document.documentElement.style.setProperty('--sign-header-text', theme.tabText);
            document.getElementById('theme-short').textContent = theme.short;
            document.getElementById('theme-name-pill').textContent = theme.name;
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').textContent = soundEnabled ? '🔊' : '🔇';
            if (soundEnabled) playTone('tap');
            triggerHaptic(12);
        }

        // =========================================================================
        // 7. CELEBRATORY CONFETTI ANIMATION FOR 12/12 WINS
        // =========================================================================
        function launchConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const colors = ['#2563EB', '#EF4444', '#FACC15', '#10B981', '#A855F7', '#F97316'];
            const pieces = Array.from({ length: 100 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                w: Math.random() * 9 + 5,
                h: Math.random() * 6 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                vy: Math.random() * 4 + 3,
                vx: (Math.random() - 0.5) * 3,
                rot: Math.random() * 360,
                vRot: (Math.random() - 0.5) * 10
            }));

            let frames = 0;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rot += p.vRot;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();
                });

                frames++;
                if (frames < 140) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            animate();
        }

        // Keyboard support for desktop testing
        document.addEventListener('keydown', (e) => {
            if (isTransitioning) return;
            if (!document.getElementById('round-modal').classList.contains('hidden')) return;

            if (e.key === 'ArrowLeft' || e.key === '1') {
                handleChoice(true);
            } else if (e.key === 'ArrowRight' || e.key === '2') {
                handleChoice(false);
            }
        });

        // Initialize mobile game on load
        window.onload = function () {
            setupSwipeGestures();
            deck = shuffleArray(ALL_SCENARIOS);
            startNewRound();
        };
    </script>
